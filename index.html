<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tienda Web</title>
    <!-- Bootstrap 5 CSS para maquetación y estilos base -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos externa para cumplir con el indicador de diseño -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Encabezado y Navegación con hipervínculos funcionales -->
    <header class="bg-dark text-white text-center py-4">
        <h1>Mi Tienda Web</h1>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark justify-content-center mt-2">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="#catalogo">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="#registro">Registro</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-5 flex-grow-1">
        <section class="row justify-content-center" id="registro">
            <article class="col-md-8 col-lg-6">
                <div class="card shadow-sm form-container">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="card-title text-center mb-4">Crear una cuenta</h2>
                        
                        <!-- Formulario con novalidate para delegar la validación a JS -->
                        <form id="registroForm" novalidate>
                            
                            <!-- Campo: Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control custom-input" id="nombre" placeholder="Ej. Juan Pérez" autocomplete="name" required>
                                <div class="invalid-feedback" id="errorNombre">Por favor, ingresa tu nombre.</div>
                            </div>

                            <!-- Campo: Correo -->
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control custom-input" id="correo" placeholder="correo@ejemplo.com" autocomplete="email" required>
                                <div class="invalid-feedback" id="errorCorreo">Ingresa un correo electrónico válido.</div>
                            </div>

                            <!-- Campo: Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control custom-input" id="password" autocomplete="new-password" required>
                                <div class="invalid-feedback" id="errorPassword">La contraseña debe tener al menos 6 caracteres.</div>
                            </div>

                            <!-- Campo: Confirmar Contraseña -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                                <input type="password" class="form-control custom-input" id="confirmPassword" autocomplete="new-password" required>
                                <div class="invalid-feedback" id="errorConfirmPassword">Las contraseñas no coinciden.</div>
                            </div>

                            <!-- Botón de Envío -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary custom-btn">Registrarse</button>
                            </div>
                        </form>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Mi Tienda Web. Todos los derechos reservados.</p>
    </footer>

    <!-- Script externo de validación -->
    <script src="script.js"></script>
</body>
</html>
